<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · Luciano Buccella</title>
<link rel="icon" type="image/png" href="apps/legacy/assets/icon/4457184.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<body class="dock-closed">
<iframe class="app-frame" id="appFrame" title="Aplicación del portfolio"></iframe>

<div class="desktop-clock" id="desktopClock">
  <span class="clock-time" id="clockTime">--:--</span>
  <span class="clock-date" id="clockDate"></span>
</div>

<nav class="ubuntu-dock" id="dock" aria-label="Dock">
  <button type="button" class="dock-close" id="dockClose" aria-label="Cerrar el dock">▼</button>
  <button type="button" class="dock-item" data-app="legacy" title="BeALegacy" aria-label="BeALegacy">
    <span class="dock-icon" aria-hidden="true">⚽</span>
    <span class="dock-dot"></span>
  </button>
  <button type="button" class="dock-item dock-placeholder" title="Próximamente" aria-label="Próximo proyecto">
    <span class="dock-icon" aria-hidden="true">🖥️</span>
    <span class="dock-dot"></span>
  </button>
  <button type="button" class="dock-item dock-placeholder" title="Próximamente" aria-label="Próximo proyecto">
    <span class="dock-icon" aria-hidden="true">🌐</span>
    <span class="dock-dot"></span>
  </button>
  <span class="dock-separator"></span>
  <button type="button" class="dock-item" data-panel="proyectos" title="Sobre los proyectos" aria-label="Información de los proyectos">
    <span class="dock-icon" aria-hidden="true">📁</span>
  </button>
  <button type="button" class="dock-item" data-panel="contacto" title="Contacto" aria-label="Información de contacto">
    <span class="dock-icon" aria-hidden="true">⚙️</span>
  </button>
</nav>

<div class="music-widget" id="musicWidget">
  <button type="button" class="music-toggle" id="musicToggle" aria-label="Ocultar o mostrar reproductor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <div class="music-panel" id="musicPanel">
    <div class="music-cover" id="musicCover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <span class="music-now" data-now>Reproduciendo</span>
    <div class="music-info">
      <span class="music-title" id="musicTitle">Tema de ejemplo</span>
      <span class="music-artist" id="musicArtist">Artista</span>
    </div>
    <div class="music-progress">
      <span class="music-time" id="musicCur">0:00</span>
      <div class="music-bar" id="musicBar"><div class="music-fill" id="musicFill"></div></div>
      <span class="music-time" id="musicDur">3:24</span>
    </div>
    <div class="music-controls">
      <button type="button" class="music-btn" data-act="shuffle" aria-label="Aleatorio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button type="button" class="music-btn" data-act="prev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button type="button" class="music-btn music-play" id="musicPlay" data-act="play" aria-label="Reproducir o pausar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button type="button" class="music-btn" data-act="next" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button type="button" class="music-btn" data-act="repeat" aria-label="Repetir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
    <div class="music-volume">
      <button type="button" class="music-vol-icon" id="musicVolIcon" aria-label="Silenciar o activar volumen" aria-pressed="false">
        <svg id="musicVolSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <div class="music-bar music-volume-bar" id="musicVolumeBar"><div class="music-fill music-vol-fill" id="musicVolFill"></div></div>
    </div>
  </div>
</div>

<div class="yt-host" id="ytHost"></div>

<button type="button" class="dock-handle" id="dockHandle" aria-label="Abrir o cerrar el dock">▲</button>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>

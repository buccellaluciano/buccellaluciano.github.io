<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; frame-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<title>Portfolio · Luciano Buccella</title>
<link rel="icon" type="image/png" href="apps/legacy/assets/icon/4457184.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body class="dock-closed">
<iframe class="app-frame" id="appFrame" title="Aplicación del portfolio" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer"></iframe>

<div class="desktop-clock" id="desktopClock">
  <span class="clock-time" id="clockTime">--:--</span>
  <span class="clock-date" id="clockDate"></span>
</div>

<nav class="ubuntu-dock" id="dock" aria-label="Dock">
  <button type="button" class="dock-close" id="dockClose" aria-label="Cerrar el dock">▼</button>
  <button type="button" class="dock-item" data-app="legacy" title="BeALegacy" aria-label="BeALegacy">
    <span class="dock-icon" aria-hidden="true">⚽</span>
    <span class="dock-dot"></span>
  </button>
  <button type="button" class="dock-item" data-app="pro" title="Booking" aria-label="Booking">
    <span class="dock-icon" aria-hidden="true">📅</span>
    <span class="dock-dot"></span>
  </button>
  <button type="button" class="dock-item dock-placeholder" title="Próximamente" aria-label="Próximo proyecto">
    <span class="dock-icon" aria-hidden="true">🌐</span>
    <span class="dock-dot"></span>
  </button>
  <span class="dock-separator"></span>
  <button type="button" class="dock-item" data-panel="proyectos" title="Sobre los proyectos" aria-label="Información de los proyectos">
    <span class="dock-icon" aria-hidden="true">📁</span>
  </button>
  <button type="button" class="dock-item" data-panel="contacto" title="Contacto" aria-label="Información de contacto">
    <span class="dock-icon" aria-hidden="true">⚙️</span>
  </button>
</nav>

<button type="button" class="dock-handle" id="dockHandle" aria-label="Abrir o cerrar el dock">▲</button>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/main.js"></script>
</body>
</html>
